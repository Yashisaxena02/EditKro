<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editkaro.in — Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    body{cursor:auto;overflow-x:hidden}
    .admin-wrap{max-width:1100px;margin:0 auto;padding:60px var(--gutter) 100px}
    .admin-login{max-width:380px;margin:14vh auto;padding:40px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
    .admin-login h2{font-family:var(--font-display);font-weight:800;font-size:28px;margin-bottom:6px}
    .admin-login p{color:var(--muted);font-size:13.5px;margin-bottom:26px}
    .admin-field{margin-bottom:18px}
    .admin-field label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .admin-field input{width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:inherit;font-size:15px;transition:border-color .3s}
    .admin-field input:focus{outline:none;border-color:var(--accent)}
    .admin-error{color:var(--accent-2);font-size:13px;margin-top:10px;display:none}
    .admin-error.show{display:block}
    .admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:36px}
    .admin-header h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;text-transform:uppercase}
    .admin-actions{display:flex;gap:12px}
    .admin-actions button{border:1px solid var(--line);border-radius:100px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink);transition:background .3s,color .3s}
    .admin-actions button:hover{background:var(--ink);color:#0A0A0C}
    .admin-actions button.primary{background:var(--accent);color:#0A0A0C;border-color:var(--accent)}
    .admin-section{margin-bottom:48px}
    .admin-section h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    thead th{text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
    tbody td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
    tbody tr:hover{background:rgba(244,241,234,.03)}
    .empty-row{color:var(--muted);padding:24px 12px;text-align:center}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true" style="width:0"></div>

  <!-- LOGIN -->
  <div class="admin-login" id="loginView" data-testid="admin-login-view">
    <h2>Admin Login</h2>
    <p>Editkaro.in — subscribers &amp; contact requests.</p>
    <form id="loginForm" data-testid="admin-login-form">
      <div class="admin-field">
        <label for="adminUsername">Username</label>
        <input type="text" id="adminUsername" required data-testid="admin-username-input" />
      </div>
      <div class="admin-field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required data-testid="admin-password-input" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" data-testid="admin-login-submit">Log in →</button>
      <p class="admin-error" id="loginError" data-testid="admin-login-error">Invalid username or password.</p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div class="admin-wrap hidden" id="dashboardView" data-testid="admin-dashboard-view">
    <div class="admin-header">
      <h1>Editkaro <span class="accent">Admin</span></h1>
      <div class="admin-actions">
        <button id="exportBtn" data-testid="admin-export-csv">Export CSV</button>
        <button id="logoutBtn" data-testid="admin-logout-btn">Log out</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Newsletter Subscribers (<span id="subCount">0</span>)</h3>
      <table data-testid="admin-subscribers-table">
        <thead><tr><th>Email</th><th>Subscribed On</th></tr></thead>
        <tbody id="subscribersBody"></tbody>
      </table>
    </div>

    <div class="admin-section">
      <h3>Contact / Quote Requests (<span id="msgCount">0</span>)</h3>
      <table data-testid="admin-messages-table">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Project Type</th><th>Message</th><th>Date</th></tr></thead>
        <tbody id="messagesBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      const $ = (s) => document.querySelector(s);
      const loginView = $("#loginView"), dashboardView = $("#dashboardView");
      const loginForm = $("#loginForm"), loginError = $("#loginError");
      let subscribersData = [], messagesData = [];

      function fmtDate(iso) {
        try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
      }

      function getToken() { return localStorage.getItem("ek_admin_token"); }
      function setToken(t) { localStorage.setItem("ek_admin_token", t); }
      function clearToken() { localStorage.removeItem("ek_admin_token"); }

      async function authedFetch(path) {
        const res = await fetch(path, { headers: { Authorization: "Bearer " + getToken() } });
        if (res.status === 401) { clearToken(); showLogin(); throw new Error("unauthorized"); }
        return res.json();
      }

      function showLogin() {
        dashboardView.classList.add("hidden");
        loginView.classList.remove("hidden");
      }

      function showDashboard() {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
        loadData();
      }

      async function loadData() {
        try {
          subscribersData = await authedFetch("/api/admin/subscribers");
          messagesData = await authedFetch("/api/admin/contact-messages");
        } catch (e) { return; }
        $("#subCount").textContent = subscribersData.length;
        $("#msgCount").textContent = messagesData.length;

        const subBody = $("#subscribersBody");
        subBody.innerHTML = subscribersData.length
          ? subscribersData.map((s) => `<tr><td>${s.email}</td><td>${fmtDate(s.created_at)}</td></tr>`).join("")
          : `<tr><td colspan="2" class="empty-row">No subscribers yet.</td></tr>`;

        const msgBody = $("#messagesBody");
        msgBody.innerHTML = messagesData.length
          ? messagesData.map((m) => `<tr><td>${m.name}</td><td>${m.email}</td><td>${m.phone}</td><td>${m.project_type || "—"}</td><td>${m.message}</td><td>${fmtDate(m.created_at)}</td></tr>`).join("")
          : `<tr><td colspan="6" class="empty-row">No messages yet.</td></tr>`;
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.classList.remove("show");
        const username = $("#adminUsername").value.trim();
        const password = $("#adminPassword").value;
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) throw new Error("Invalid");
          const data = await res.json();
          setToken(data.access_token);
          showDashboard();
        } catch (err) {
          loginError.classList.add("show");
        }
      });

      $("#logoutBtn").addEventListener("click", () => { clearToken(); showLogin(); });

      $("#exportBtn").addEventListener("click", () => {
        const rows = [["Type", "Name", "Email", "Phone", "Project Type", "Message", "Date"]];
        subscribersData.forEach((s) => rows.push(["Subscriber", "", s.email, "", "", "", s.created_at]));
        messagesData.forEach((m) => rows.push(["Contact", m.name, m.email, m.phone, m.project_type || "", m.message, m.created_at]));
        const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "editkaro-submissions.csv";
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      });

      if (getToken()) { showDashboard(); } else { showLogin(); }
    })();
  </script>
</body>
</html>
